[package]
name = "obsidian-core"
description = "OS-native WebView browser engine lifecycle for the Obsidian web browser."
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS-native WebView (~10MB target): Edge WebView2 on Windows, WebKitGTK on Linux,
# Android WebView on mobile. Pairs with winit for cross-platform window embedding.
wry = "0.47"

# Needed for raw-window-handle interop when passing the winit Window to wry.
raw-window-handle = "0.6"
winit = "0.30"
