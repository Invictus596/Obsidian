[package]
name = "obsidian-ui"
description = "Browser UI shell for the Obsidian web browser."
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4"
thiserror = "1.0"

# Cross-platform window management (borderless, translucent, etc.)
winit = { version = "0.30", features = ["rwh_06"] }

# Declarative UI toolkit for the fluid Arc/Helium-inspired shell
slint = { version = "1.6", features = ["backend-winit"] }

# Raw window handle access (HWND on Windows) for CEF viewport attachment
raw-window-handle = "0.6"

# CEF core for resize_browser() calls on window resize
obsidian-core = { path = "../obsidian-core" }

[build-dependencies]
# Compiles .slint UI templates at build time
slint-build = "1.6"
